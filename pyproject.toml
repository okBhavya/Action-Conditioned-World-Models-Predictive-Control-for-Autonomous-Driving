[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driving-wm"
version = "0.1.0"
description = "Action-conditioned world models and predictive control for autonomous driving"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "gymnasium>=0.29",
    "metadrive-simulator>=0.4,<0.5",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "imageio>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sim: tests requiring MetaDrive simulator (may be slow)",
]
